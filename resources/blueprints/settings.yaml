tabs:
  main:
    display: Settings
    sections:
      -
        display: Collections
        instructions: Where Ghostwriter offers to write, and what it reads to learn your voice.
        fields:
          -
            handle: collections
            field:
              type: collections
              display: Write for these collections
              instructions: 'A "Write with Ghostwriter" button appears on the create screen of each one. Leave empty to offer every collection.'
              mode: select
          -
            handle: voice_collections
            field:
              type: collections
              display: Learn the voice from these collections
              instructions: Read when the tone of voice guide is generated. Leave empty to read every collection.
              mode: select
          -
            handle: show_get_started
            field:
              type: toggle
              display: Show Get started
              instructions: 'Bring the Get started steps back to the navigation and the Overview after they were hidden. Saving with this on shows them again; it is not stored.'
              default: false
          -
            handle: suggest_kinds
            field:
              type: toggle
              display: Suggest kinds of content
              instructions: 'When Get started opens, look over each collection for kinds of content worth teaching: the first time it is seen, and again once ten more entries have been published. Everywhere else, and with this off, kinds are only suggested when someone clicks Suggest kinds.'
              default: true
      -
        display: API keys
        instructions: 'Keys live only in your .env file, never on this screen. Whether each one is set:'
        fields: []
      -
        display: AI provider
        instructions: 'The API key is never stored here. Set ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY or OPENROUTER_API_KEY in your .env file, or Connect with OpenRouter below.'
        fields:
          -
            handle: provider
            field:
              type: select
              display: Provider
              options:
                anthropic: 'Claude (Anthropic)'
                openai: 'ChatGPT (OpenAI)'
                gemini: 'Gemini (Google)'
                openrouter: 'OpenRouter (Claude, GPT, Gemini and others)'
              default: anthropic
              width: 50
          -
            handle: model
            field:
              type: text
              display: Model
              instructions: "Leave blank to use the provider's default model."
              width: 50
          -
            handle: openrouter_writing_model
            field:
              type: select
              display: 'OpenRouter model for writing'
              instructions: 'The writer, briefs, guides and planning. Leave blank for Claude Opus 5.5. For any other model on openrouter.ai/models, put its id in Model.'
              clearable: true
              options: []
              width: 50
              if:
                provider: openrouter
          -
            handle: openrouter_quick_model
            field:
              type: select
              display: 'OpenRouter model for quick jobs'
              instructions: 'Choosing photos and filling a gap. Leave blank for Claude Sonnet 5.5.'
              clearable: true
              options: []
              width: 50
              if:
                provider: openrouter
      -
        display: Images
        instructions: 'Images are made by ChatGPT or Gemini, directly or through OpenRouter; Claude cannot make them. Set OPENAI_API_KEY or GEMINI_API_KEY in your .env file, or connect OpenRouter. Each image is modelled on the ones already used in the same field on your other entries. Without a key, free photographs can still be searched for: Openverse needs no key, and UNSPLASH_ACCESS_KEY, PIXABAY_API_KEY or PEXELS_API_KEY add those libraries.'
        fields:
          -
            handle: image_provider
            field:
              type: select
              display: Image provider
              instructions: Leave blank to use whichever has an API key.
              clearable: true
              options:
                openai: 'ChatGPT (OpenAI)'
                gemini: 'Gemini (Google)'
                openrouter: OpenRouter
              width: 50
          -
            handle: placeholder_images
            field:
              type: toggle
              display: Mark images still to choose
              instructions: 'When a draft is put into a new entry, image fields it should have but left empty get a shared striped placeholder image, so the layout shows and nothing is missed.'
              default: true
              width: 50
          -
            handle: image_model
            field:
              type: text
              display: Image model
              instructions: "Leave blank to use the provider's default model."
              width: 50
          -
            handle: openverse
            field:
              type: toggle
              display: Search Openverse
              instructions: 'Public-domain and CC0 photographs, with no key needed.'
              default: true
              width: 50
      -
        display: Stock photos
        instructions: 'Paid photo libraries, licensed from your own account with the library. A paid photo goes into a page as a preview: a labelled stand-in image, with the watermarked photo shown only to signed-in editors. A manager licenses it before the page is published, and the stand-in is replaced with the full image. Keys and secrets live only in your .env file, never on this screen.'
        fields:
          -
            handle: stock_default_source
            field:
              type: select
              display: Default source
              instructions: 'Where "Search in" starts in the image dialog, until someone chooses another. Each person''s last choice is remembered.'
              options:
                free: Free libraries
              default: free
              width: 50
          -
            handle: stock_include_editorial
            field:
              type: toggle
              display: Include editorial images by default
              instructions: 'Editorial images (news, events, well-known people) may not be used to sell or promote anything. Most pages are commercial use, so they are left out unless this is on or someone ticks "Include editorial images".'
              default: false
              width: 50
      -
        display: Finish this page
        instructions: 'Ghostwriter marks what only a person can finish (a fact to add, a link to choose, an image to pick) and walks the editor through it on the entry''s form.'
        fields:
          -
            handle: on_unfinished_publish
            field:
              type: button_group
              display: When a page with something unfinished is published
              instructions: 'Something unfinished is a fact still to add (`[[ask: …]]`), a link still to choose, an image placeholder or a stock preview not licensed yet. Block refuses to publish the page, with a message on each field; saving it unpublished still works. Warn publishes it and says so.'
              options:
                block: Block
                warn: Warn
              default: block
      -
        display: Suggest edits and Content to revisit
        instructions: 'Suggest edits reads a page against your voice guide when someone asks (a menu item under Edit with Ghostwriter). Content to revisit, on the Overview, ranks your published pages by checks that need no AI: dates, links, alt text, empty fields and age.'
        fields:
          -
            handle: suggest_claims
            field:
              type: toggle
              display: Check claims and counts
              instructions: 'Flag counts and claims about you ("a team of 6", "over 20 years", "award-winning") on older pages as facts to check. Ghostwriter never changes a fact itself: it asks you.'
              default: true
              width: 50
          -
            handle: revisit_external_links
            field:
              type: toggle
              display: Check links to other sites once a week
              instructions: 'Off by default. Once a week, Ghostwriter asks each site your pages link to whether the page is still there (a HEAD request, at most one a second per site). Broken ones show as Link suggestions and in Content to revisit. Links to your own pages are always checked, with no request.'
              default: false
              width: 50
          -
            handle: revisit_age_in_full
            field:
              type: collections
              display: Count age in full in these dated collections
              instructions: 'In a collection with dates (a journal, news), an old post is meant to be old, so age and past years count for a quarter. Choose any dated collection where they should count in full, as they do everywhere else.'
              mode: select
