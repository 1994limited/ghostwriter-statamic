tabs:
  main:
    display: Settings
    sections:
      -
        display: Collections
        instructions: Where Ghostwriter offers to write, and what it reads to learn your voice.
        fields:
          -
            handle: collections
            field:
              type: collections
              display: Write for these collections
              instructions: 'A "Write with Ghostwriter" button appears on the create screen of each one. Leave empty to offer every collection.'
              mode: select
          -
            handle: voice_collections
            field:
              type: collections
              display: Learn the voice from these collections
              instructions: Read when the tone of voice guide is generated. Leave empty to read every collection.
              mode: select
          -
            handle: show_get_started
            field:
              type: toggle
              display: Show Get started
              instructions: 'Bring the Get started steps back to the navigation and the Overview after they were hidden. Saving with this on shows them again; it is not stored.'
              default: false
          -
            handle: suggest_kinds
            field:
              type: toggle
              display: Suggest kinds of content
              instructions: 'When Get started opens, look over each collection for kinds of content worth teaching: the first time it is seen, and again once ten more entries have been published. Everywhere else, and with this off, kinds are only suggested when someone clicks Suggest kinds.'
              default: true
      -
        display: API keys
        instructions: 'Keys live only in your .env file, never on this screen. Whether each one is set:'
        fields: []
      -
        display: AI provider
        instructions: 'The API key is never stored here. Set ANTHROPIC_API_KEY, OPENAI_API_KEY or GEMINI_API_KEY in your .env file.'
        fields:
          -
            handle: provider
            field:
              type: select
              display: Provider
              options:
                anthropic: 'Claude (Anthropic)'
                openai: 'ChatGPT (OpenAI)'
                gemini: 'Gemini (Google)'
              default: anthropic
              width: 50
          -
            handle: model
            field:
              type: text
              display: Model
              instructions: "Leave blank to use the provider's default model."
              width: 50
      -
        display: Images
        instructions: 'Images are made by ChatGPT or Gemini; Claude cannot make them. Set OPENAI_API_KEY or GEMINI_API_KEY in your .env file. Each image is modelled on the ones already used in the same field on your other entries. Without a key, free photographs can still be searched for: Openverse needs no key, and UNSPLASH_ACCESS_KEY, PIXABAY_API_KEY or PEXELS_API_KEY add those libraries.'
        fields:
          -
            handle: image_provider
            field:
              type: select
              display: Image provider
              instructions: Leave blank to use whichever has an API key.
              clearable: true
              options:
                openai: 'ChatGPT (OpenAI)'
                gemini: 'Gemini (Google)'
              width: 50
          -
            handle: placeholder_images
            field:
              type: toggle
              display: Mark images still to choose
              instructions: 'When a draft is put into a new entry, image fields it should have but left empty get a shared striped placeholder image, so the layout shows and nothing is missed.'
              default: true
              width: 50
          -
            handle: image_model
            field:
              type: text
              display: Image model
              instructions: "Leave blank to use the provider's default model."
              width: 50
          -
            handle: openverse
            field:
              type: toggle
              display: Search Openverse
              instructions: 'Public-domain and CC0 photographs, with no key needed.'
              default: true
              width: 50
      -
        display: Stock photos
        instructions: 'Paid photo libraries, licensed from your own account with the library. A paid photo goes into a page as a preview: a labelled stand-in image, with the watermarked photo shown only to signed-in editors. A manager licenses it before the page is published, and the stand-in is replaced with the full image. Keys and secrets live only in your .env file, never on this screen.'
        fields:
          -
            handle: stock_default_source
            field:
              type: select
              display: Default source
              instructions: 'Where "Search in" starts in the image dialog, until someone chooses another. Each person''s last choice is remembered.'
              options:
                free: Free libraries
              default: free
              width: 50
          -
            handle: stock_include_editorial
            field:
              type: toggle
              display: Include editorial images by default
              instructions: 'Editorial images (news, events, well-known people) may not be used to sell or promote anything. Most pages are commercial use, so they are left out unless this is on or someone ticks "Include editorial images".'
              default: false
              width: 50
      -
        display: Finish this page
        instructions: 'Ghostwriter marks what only a person can finish (a fact to add, a link to choose, an image to pick) and walks the editor through it on the entry''s form.'
        fields:
          -
            handle: on_unfinished_publish
            field:
              type: button_group
              display: When a page with something unfinished is published
              instructions: 'Something unfinished is a fact still to add (`[[ask: …]]`), a link still to choose, an image placeholder or a stock preview not licensed yet. Block refuses to publish the page, with a message on each field; saving it unpublished still works. Warn publishes it and says so.'
              options:
                block: Block
                warn: Warn
              default: block
