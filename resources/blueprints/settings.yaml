tabs:
  main:
    display: Settings
    sections:
      -
        display: Collections
        instructions: Where Ghostwriter offers to write, and what it reads to learn your voice.
        fields:
          -
            handle: collections
            field:
              type: collections
              display: Write for these collections
              instructions: 'A "Write with Ghostwriter" button appears on the create screen of each one. Leave empty to offer every collection.'
              mode: select
          -
            handle: voice_collections
            field:
              type: collections
              display: Learn the voice from these collections
              instructions: Read when the tone of voice guide is generated. Leave empty to read every collection.
              mode: select
          -
            handle: show_get_started
            field:
              type: toggle
              display: Show Get started
              instructions: 'Bring the Get started steps back to the navigation and the dashboard after they were hidden. Saving with this on shows them again; it is not stored.'
              default: false
          -
            handle: suggest_kinds
            field:
              type: toggle
              display: Suggest kinds of content
              instructions: 'Look over each collection for kinds of content worth teaching, the first time it is seen and again once ten more entries have been published. Off, kinds are only suggested when asked.'
              default: true
      -
        display: AI provider
        instructions: 'The API key is never stored here. Set ANTHROPIC_API_KEY, OPENAI_API_KEY or GEMINI_API_KEY in your .env file.'
        fields:
          -
            handle: provider
            field:
              type: select
              display: Provider
              options:
                anthropic: 'Claude (Anthropic)'
                openai: 'ChatGPT (OpenAI)'
                gemini: 'Gemini (Google)'
              default: anthropic
              width: 50
          -
            handle: model
            field:
              type: text
              display: Model
              instructions: "Leave blank to use the provider's default model."
              width: 50
      -
        display: Images
        instructions: 'Images are made by ChatGPT or Gemini; Claude cannot make them. Set OPENAI_API_KEY or GEMINI_API_KEY in your .env file. Each image is modelled on the ones already used in the same field on your other entries. Without a key, free photographs can still be searched for: Openverse needs no key, and UNSPLASH_ACCESS_KEY, PIXABAY_API_KEY or PEXELS_API_KEY add those libraries.'
        fields:
          -
            handle: image_provider
            field:
              type: select
              display: Image provider
              instructions: Leave blank to use whichever has an API key.
              clearable: true
              options:
                openai: 'ChatGPT (OpenAI)'
                gemini: 'Gemini (Google)'
              width: 50
          -
            handle: placeholder_images
            field:
              type: toggle
              display: Striped placeholders
              instructions: 'When a draft is put into a new entry, image fields it should have but left empty get a shared striped placeholder image, so the layout shows and nothing is missed.'
              default: true
              width: 50
          -
            handle: image_model
            field:
              type: text
              display: Image model
              instructions: "Leave blank to use the provider's default model."
              width: 50
