name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.core == 'main' && 'core main' || format('PHP {0} ({1})', matrix.php, matrix.deps) }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json requires PHP ^8.3 (PHPUnit 12 and Laravel 13 need it).
        php: ['8.3', '8.4']
        deps: [highest]
        # released: core from Packagist. main: see "core main" below.
        core: [released]
        include:
          # The oldest versions composer.json allows: Statamic 6.30 on Laravel 12.
          - php: '8.3'
            deps: lowest
          # "core main": the newest versions against core's main branch, the
          # gate while core and the addons are developed together (README).
          - php: '8.4'
            deps: highest
            core: main

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, gd, exif, fileinfo, intl
          coverage: none

      # composer.lock isn't committed, so the cache is keyed on composer.json
      # and holds downloads only; every run resolves afresh.
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      # "core main" only: core's main branch from GitHub instead of the release
      # on Packagist, aliased to 1.99.0 so it satisfies composer.json's ^1.x.
      # Core is public: no token needed.
      - name: Use core main
        if: matrix.core == 'main'
        run: |
          composer config repositories.core vcs https://github.com/1994limited/ghostwriter-core
          composer require --no-update "1994/ghostwriter-core:dev-main as 1.99.0"

      - name: Install dependencies
        env:
          DEPS: ${{ matrix.deps }}
        run: |
          flags="--no-interaction --no-progress --prefer-dist"
          case "$DEPS" in
            lowest) composer update $flags --prefer-lowest --prefer-stable ;;
            *)      composer update $flags ;;
          esac
          composer show | grep -E '^(statamic/cms|laravel/framework|1994/ghostwriter-core|orchestra/testbench|phpunit/phpunit) '

      # Style doesn't depend on the versions installed.
      - name: Code style
        if: matrix.deps != 'lowest'
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/phpunit

  js:
    name: Guide and preview logic (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Finish this page guide's state and DOM helpers, and the page
      # preview's overlay logic, have no dependencies, so Node's own test
      # runner is enough: no install.
      - name: Tests
        run: node --test resources/js/finish/*.test.js resources/js/preview/*.test.js resources/js/suggest/*.test.js
